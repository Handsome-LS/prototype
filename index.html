<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>供应链财务模块</title>
  <meta name="description" content="供应链财务模块 HTML 交互原型">
  <link rel="stylesheet" href="assets/styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true" focusable="false">
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-5h4v5"/></symbol>
    <symbol id="i-data" viewBox="0 0 24 24"><path d="M5 6.5C5 5.1 8.1 4 12 4s7 1.1 7 2.5S15.9 9 12 9 5 7.9 5 6.5Z"/><path d="M5 6.5v5C5 12.9 8.1 14 12 14s7-1.1 7-2.5v-5"/><path d="M5 11.5v5C5 17.9 8.1 19 12 19s7-1.1 7-2.5v-5"/></symbol>
    <symbol id="i-table" viewBox="0 0 24 24"><path d="M4 5h16v14H4z"/><path d="M4 10h16"/><path d="M9 5v14"/><path d="M15 5v14"/></symbol>
    <symbol id="i-user" viewBox="0 0 24 24"><path d="M16 19c0-2.2-1.8-4-4-4s-4 1.8-4 4"/><path d="M12 12a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M18 11.5c1.6.4 2.7 1.7 3 3.5"/><path d="M17 5.5a3 3 0 0 1 0 5"/></symbol>
    <symbol id="i-wallet" viewBox="0 0 24 24"><path d="M5 7h14a2 2 0 0 1 2 2v9H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h12"/><path d="M16 13h5"/><path d="M17.5 13.1h.1"/></symbol>
    <symbol id="i-flow" viewBox="0 0 24 24"><path d="M5 12h4l2-5 4 10 2-5h2"/><path d="M4 19h16"/></symbol>
    <symbol id="i-bill" viewBox="0 0 24 24"><path d="M7 4h10v16l-2-1.2-2 1.2-2-1.2-2 1.2-2-1.2Z"/><path d="M9.5 9h5"/><path d="M9.5 13h5"/></symbol>
    <symbol id="i-factory" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M5 19V9l5 3V9l5 3V6h4v13"/><path d="M8 15h1.5"/><path d="M12 15h1.5"/><path d="M16 15h1.5"/></symbol>
    <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 7h11"/><path d="M9 12h11"/><path d="M9 17h11"/><path d="M4 7h1"/><path d="M4 12h1"/><path d="M4 17h1"/></symbol>
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M12 16V5"/><path d="m8 9 4-4 4 4"/><path d="M5 16v3h14v-3"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z"/><path d="m16.5 16.5 3.5 3.5"/></symbol>
    <symbol id="i-settle" viewBox="0 0 24 24"><path d="M7 5h10v14H7z"/><path d="M9.5 9h5"/><path d="M9.5 12h5"/><path d="M10 16h2"/><path d="M15 16h.5"/></symbol>
    <symbol id="i-report" viewBox="0 0 24 24"><path d="M5 19V5h14v14Z"/><path d="M9 16v-4"/><path d="M12 16V8"/><path d="M15 16v-6"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 7h11v9H3z"/><path d="M14 10h4l3 3v3h-7"/><path d="M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/><path d="M17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4Z"/></symbol>
    <symbol id="i-sum" viewBox="0 0 24 24"><path d="M6 5h12"/><path d="M6 19h12"/><path d="m8 7 5 5-5 5h9"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19h16"/><path d="M7 16v-5"/><path d="M12 16V6"/><path d="M17 16V9"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><path d="M12 4 21 20H3Z"/><path d="M12 9v5"/><path d="M12 17h.1"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z"/><path d="M19 12a7.2 7.2 0 0 0-.1-1l2-1.5-2-3.4-2.4 1a7.7 7.7 0 0 0-1.7-1L14.5 3h-5l-.3 3.1a7.7 7.7 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.2 7.2 0 0 0 0 2l-2 1.5 2 3.4 2.4-1a7.7 7.7 0 0 0 1.7 1l.3 3.1h5l.3-3.1a7.7 7.7 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5c.1-.3.1-.7.1-1Z"/></symbol>
    <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M5 7h14"/><path d="M5 17h14"/><path d="M9 4v6"/><path d="M15 14v6"/></symbol>
  </svg>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">FM</span>
        <div><strong>供应链财务</strong><small>FINANCE MODULE</small></div>
      </div>
      <nav class="nav-list" aria-label="财务导航">
        <button class="nav-item nav-root is-active" data-nav="home" aria-current="page"><svg class="nav-icon" aria-hidden="true"><use href="#i-home"></use></svg><b>首页</b></button>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-data"></use></svg><b>数据中心</b></summary>
          <button class="nav-item nav-subitem" data-nav="baseData"><svg class="nav-icon" aria-hidden="true"><use href="#i-table"></use></svg><b>基础数据中心</b></button>
        </details>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-list"></use></svg><b>财务事件</b></summary>
          <button class="nav-item nav-subitem" data-nav="income"><svg class="nav-icon" aria-hidden="true"><use href="#i-wallet"></use></svg><b>收入流水</b></button>
          <button class="nav-item nav-subitem" data-nav="expense"><svg class="nav-icon" aria-hidden="true"><use href="#i-list"></use></svg><b>支出流水</b></button>
        </details>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-user"></use></svg><b>客户相关</b></summary>
          <button class="nav-item nav-subitem" data-nav="consumption"><svg class="nav-icon" aria-hidden="true"><use href="#i-flow"></use></svg><b>客户消耗流水</b><em data-badge="consumption">6</em></button>
          <button class="nav-item nav-subitem" data-nav="customerBills"><svg class="nav-icon" aria-hidden="true"><use href="#i-bill"></use></svg><b>客户资金对账单</b></button>
        </details>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-factory"></use></svg><b>工厂相关</b></summary>
          <button class="nav-item nav-subitem" data-nav="bills"><svg class="nav-icon" aria-hidden="true"><use href="#i-bill"></use></svg><b>工厂账单</b><em data-badge="bills">12</em></button>
          <button class="nav-item nav-subitem" data-nav="reconcile"><svg class="nav-icon" aria-hidden="true"><use href="#i-search"></use></svg><b>对账工作台</b><em data-badge="reconcile">18</em></button>
          <button class="nav-item nav-subitem" data-nav="settlement"><svg class="nav-icon" aria-hidden="true"><use href="#i-settle"></use></svg><b>工厂结算</b></button>
          <button class="nav-item nav-subitem" data-nav="factoryCosts"><svg class="nav-icon" aria-hidden="true"><use href="#i-sum"></use></svg><b>工厂成本</b></button>
          <button class="nav-item nav-subitem" data-nav="supplier"><svg class="nav-icon" aria-hidden="true"><use href="#i-report"></use></svg><b>工厂报表</b></button>
        </details>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-truck"></use></svg><b>物流商相关</b></summary>
          <button class="nav-item nav-subitem" data-nav="logisticsBills"><svg class="nav-icon" aria-hidden="true"><use href="#i-bill"></use></svg><b>物流账单</b><em data-badge="logisticsBills">9</em></button>
          <button class="nav-item nav-subitem" data-nav="logisticsReconcile"><svg class="nav-icon" aria-hidden="true"><use href="#i-search"></use></svg><b>物流成本对账</b><em data-badge="logisticsReconcile">14</em></button>
          <button class="nav-item nav-subitem" data-nav="logisticsSettlement"><svg class="nav-icon" aria-hidden="true"><use href="#i-settle"></use></svg><b>物流结算</b></button>
          <button class="nav-item nav-subitem" data-nav="logistics"><svg class="nav-icon" aria-hidden="true"><use href="#i-sum"></use></svg><b>物流成本</b></button>
          <button class="nav-item nav-subitem" data-nav="logisticsReport"><svg class="nav-icon" aria-hidden="true"><use href="#i-report"></use></svg><b>物流报表</b></button>
        </details>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-chart"></use></svg><b>分析相关</b></summary>
          <button class="nav-item nav-subitem" data-nav="profit"><svg class="nav-icon" aria-hidden="true"><use href="#i-chart"></use></svg><b>订单利润</b></button>
          <button class="nav-item nav-subitem" data-nav="exceptions"><svg class="nav-icon" aria-hidden="true"><use href="#i-alert"></use></svg><b>财务异常</b><em class="danger" data-badge="exceptions">27</em></button>
        </details>
        <details class="nav-group">
          <summary><svg class="nav-icon" aria-hidden="true"><use href="#i-settings"></use></svg><b>配置</b></summary>
          <button class="nav-item nav-subitem" data-nav="operationLogs"><svg class="nav-icon" aria-hidden="true"><use href="#i-list"></use></svg><b>操作日志</b></button>
          <button class="nav-item nav-subitem" data-nav="config"><svg class="nav-icon" aria-hidden="true"><use href="#i-sliders"></use></svg><b>财务配置</b></button>
        </details>
      </nav>
      <div class="sidebar-foot">
        <span class="dot"></span>
        <div><strong>Mock 数据</strong><small>本地原型环境</small></div>
      </div>
    </aside>

    <main class="main-shell">
      <header class="topbar">
        <div>
          <p class="breadcrumb">财务 / <span data-crumb>财务首页</span></p>
          <h1 data-title>财务首页</h1>
        </div>
        <div class="topbar-actions">
          <span class="updated">时间：<b data-realtime>--:--:--</b></span>
          <span class="updated">最后更新：<b data-updated>21:30:00</b></span>
          <button class="button button-secondary" data-refresh>刷新</button>
        </div>
      </header>

      <section class="filterbar">
        <label><span>时间范围</span><select data-filter="range"><option>本月</option><option>今日</option><option>本周</option><option>上月</option><option>自定义</option></select></label>
        <label class="custom-date" data-custom-date hidden><span>开始日期</span><input type="date" data-filter="customStart" value="2026-08-01"></label>
        <label class="custom-date" data-custom-date hidden><span>结束日期</span><input type="date" data-filter="customEnd" value="2026-08-14"></label>
        <label><span>客户</span><select data-filter="customer"><option value="all">全部客户</option></select></label>
        <label><span>工厂</span><select data-filter="supplier"><option value="all">全部工厂</option></select></label>
        <label><span>交易 / 账单币种</span><select data-filter="currency"><option value="all">全部币种</option><option>CNY</option><option>USD</option><option>EUR</option><option>GBP</option></select></label>
        <label><span>订单类型</span><select data-filter="orderType"><option value="all">全部类型</option><option>正常单</option><option>售后单</option><option>补发单</option></select></label>
        <label><span>SKU</span><select data-filter="sku"><option value="all">全部 SKU</option></select></label>
        <button class="filter-reset" data-reset>重置</button>
      </section>

      <div class="active-filters" data-active-filters hidden></div>
      <div class="page-content" data-page></div>
    </main>
  </div>

  <div class="drawer-backdrop" data-backdrop hidden></div>
  <aside class="drawer" data-drawer aria-hidden="true">
    <header class="drawer-head">
      <div><p data-drawer-kicker>详情</p><h2 data-drawer-title>—</h2></div>
      <button class="icon-button" data-close aria-label="关闭">×</button>
    </header>
    <div class="drawer-body" data-drawer-body></div>
  </aside>

  <div class="modal-backdrop" data-modal-backdrop hidden></div>
  <section class="modal" data-modal aria-hidden="true">
    <header class="modal-head">
      <div><p data-modal-kicker>处理</p><h2 data-modal-title>—</h2></div>
      <button class="icon-button" data-close-modal aria-label="关闭">×</button>
    </header>
    <div class="modal-body" data-modal-body></div>
  </section>

  <div class="toast" data-toast role="status" aria-live="polite"></div>

  <script src="assets/mock-data.js"></script>
  <script src="assets/echarts.min.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
